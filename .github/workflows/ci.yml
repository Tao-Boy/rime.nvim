name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install librime and data
        run: |
          sudo apt-get update
          sudo apt-get install -y librime1t64 librime-plugin-lua rime-data-luna-pinyin
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: make
      - run: make test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make

  # Neovim, librime and rime-data from nixpkgs, not linked into a profile:
  # exercises the /nix/store lookup.
  test-nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: >
          nix shell nixpkgs#neovim-unwrapped nixpkgs#librime nixpkgs#rime-data
          nixpkgs#gcc nixpkgs#gnumake --command bash -c 'make && make test'
